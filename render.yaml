# Render Blueprint — https://dashboard.render.com/blueprints
# After connecting this repo, create from Blueprint or set services manually.

databases:
  - name: aether-db
    plan: free
    databaseName: aether
    user: aether

services:
  # API + WebSocket (Socket.IO)
  - type: web
    name: aether-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aether-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        # Set this AFTER frontend deploys, e.g. https://aether-web.onrender.com
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  # React static frontend
  - type: web
    name: aether-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Set to API URL, e.g. https://aether-api.onrender.com
        sync: false
      - key: VITE_WS_URL
        # Same as API URL for Socket.IO
        sync: false
